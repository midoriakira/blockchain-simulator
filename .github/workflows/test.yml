name: simulator-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build original and run simulator checks
        run: make test original
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Check the analysis pipeline
        run: |
          python experiments/run.py --quick --output results/ci
          python experiments/analyze.py results/ci --plots
